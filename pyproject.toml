[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turkish-rag-kit"
version = "0.1.0"
description = "Retrieval basics that respect Turkish: case folding, light stemming, sentence chunking, BM25."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Oğuzhan Balım" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
turkish-rag = "turkish_rag_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/turkish_rag_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
